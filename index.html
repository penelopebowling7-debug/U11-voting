<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMJRLFC U11 Voting</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background: #000;
            border-bottom: 4px solid #ff8c00;
            padding: 15px 10px 20px;
        }

        header img {
            height: 70px;
        }

        h1 {
            margin: 8px 0 0 0;
            font-size: 24px;
            color: #ff8c00;
        }

        h2 {
            margin: 4px 0 0 0;
            font-weight: normal;
            font-size: 16px;
            color: #fff;
        }

        .container {
            padding: 20px 10px 40px;
        }

        .section-title {
            margin-bottom: 10px;
            font-size: 18px;
            color: #ff8c00;
        }

        .player-btn,
        .coach-btn {
            display: block;
            width: 90%;
            max-width: 400px;
            margin: 8px auto;
            padding: 14px;
            background-color: #000;
            color: #fff;
            border: 2px solid #ff8c00;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .player-btn:hover,
        .coach-btn:hover {
            background-color: #ff8c00;
            color: #000;
        }

        .coach-btn {
            margin-top: 20px;
            font-weight: bold;
        }

        .back-btn {
            margin-top: 20px;
            background-color: #333;
            border-color: #666;
        }

        .back-btn:hover {
            background-color: #666;
            color: #000;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
        }

        .modal-content {
            background: #111;
            margin: 25% auto;
            padding: 20px;
            width: 85%;
            max-width: 360px;
            border-radius: 10px;
            border: 2px solid #ff8c00;
        }

        .modal h3 {
            margin-top: 0;
            color: #ff8c00;
        }

        .modal p {
            margin: 10px 0 20px;
        }

        .modal button {
            width: 45%;
            padding: 10px;
            margin: 5px;
            border: 2px solid #ff8c00;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .confirm-btn {
            background-color: #ff8c00;
            color: #000;
        }

        .cancel-btn {
            background-color: #000;
            color: #fff;
        }

        .confirm-btn:hover {
            background-color: #ffa733;
        }

        .cancel-btn:hover {
            background-color: #333;
        }

        /* Coach panel */
        #coachPanel {
            display: none;
            padding: 10px 10px 40px;
            border-top: 2px solid #ff8c00;
        }

        .coach-controls {
            margin-bottom: 15px;
        }

        .coach-controls button {
            display: inline-block;
            width: 45%;
            max-width: 200px;
        }

        table {
            width: 100%;
            max-width: 500px;
            margin: 10px auto 0;
            border-collapse: collapse;
            color: #fff;
        }

        th, td {
            border: 1px solid #444;
            padding: 6px;
            font-size: 14px;
        }

        th {
            background-color: #111;
            color: #ff8c00;
        }

        .reset-btn {
            margin-top: 15px;
            background-color: #000;
            border-color: #ff0000;
            color: #ff0000;
        }

        .reset-btn:hover {
            background-color: #ff0000;
            color: #000;
        }

        .small-note {
            font-size: 12px;
            color: #ccc;
            margin-top: 6px;
        }
    </style>
</head>

<body>

<header>
    <img src="WMJRLFC-logo.jpg" alt="Club Logo">
    <h1>WMJRLFC U11 Voting</h1>
    <h2>U11's Players' Player Voting</h2>
</header>

<!-- MAIN SCREEN: SELECT VOTER -->
<div class="container" id="mainScreen">
    <div class="section-title">Select Your Name</div>
    <div id="voterList"></div>

    <button class="coach-btn" id="coachLoginBtn">Coach Access</button>
    <p class="small-note">Coach access is PIN protected.</p>
</div>

<!-- VOTING SCREEN -->
<div class="container" id="voteScreen" style="display:none;">
    <div class="section-title" id="voterTitle"></div>
    <p>Select the player you want to vote for:</p>
    <div id="playerList"></div>

    <button class="player-btn back-btn" id="backToMainBtn">Back</button>
</div>

<!-- CONFIRMATION MODAL -->
<div id="confirmModal" class="modal">
    <div class="modal-content">
        <h3>Confirm Vote</h3>
        <p id="confirmText"></p>
        <button class="confirm-btn" id="confirmVoteBtn">Confirm</button>
        <button class="cancel-btn" id="cancelVoteBtn">Cancel</button>
    </div>
</div>

<!-- COACH PANEL -->
<div id="coachPanel">
    <div class="section-title">Coach Controls</div>
    <div class="coach-controls">
