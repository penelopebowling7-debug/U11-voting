<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMJRLFC U11 Voting</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background: #000;
            border-bottom: 4px solid #ff8c00;
            padding: 15px 10px 20px;
        }

        header img {
            height: 70px;
        }

        h1 {
            margin: 8px 0 0 0;
            font-size: 24px;
            color: #ff8c00;
        }

        h2 {
            margin: 4px 0 0 0;
            font-weight: normal;
            font-size: 16px;
            color: #fff;
        }

        .container {
            padding: 20px 10px 40px;
        }

        .section-title {
            margin-bottom: 10px;
            font-size: 18px;
            color: #ff8c00;
        }

        .sub-round {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 10px;
        }

        .player-btn,
        .coach-btn {
            display: block;
            width: 90%;
            max-width: 400px;
            margin: 8px auto;
            padding: 14px;
            background-color: #000;
            color: #fff;
            border: 2px solid #ff8c00;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .player-btn:hover,
        .coach-btn:hover {
            background-color: #ff8c00;
            color: #000;
        }

        .back-btn {
            margin-top: 20px;
            background-color: #333;
            border-color: #666;
        }

        .back-btn:hover {
            background-color: #666;
            color: #000;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
        }

        .modal-content {
            background: #111;
            margin: 25% auto;
            padding: 20px;
            width: 85%;
            max-width: 360px;
            border-radius: 10px;
            border: 2px solid #ff8c00;
        }

        .modal h3 {
            margin-top: 0;
            color: #ff8c00;
        }

        .modal button {
            width: 45%;
            padding: 10px;
            margin: 5px;
            border: 2px solid #ff8c00;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .confirm-btn {
            background-color: #ff8c00;
            color: #000;
        }

        .cancel-btn {
            background-color: #000;
            color: #fff;
        }

        .confirm-btn:hover {
            background-color: #ffa733;
        }

        .cancel-btn:hover {
            background-color: #333;
        }
