<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WMJRLFC U11 Voting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --tigers-orange: #f57c00;
      --tigers-black: #111111;
      --tigers-grey: #f2f2f2;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      margin: 0;
      background: var(--tigers-grey);
      color: #222;
    }

    .app-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 12px 24px;
    }

    .top-bar {
      background: var(--tigers-black);
      color: white;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .club-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .club-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 4px;
      background: white;
      padding: 2px;
    }

    .titles {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .titles-main {
      font-weight: 700;
      font-size: 16px;
    }

    .titles-sub {
      font-size: 13px;
      opacity: 0.9;
    }

    .coach-button {
      background: var(--tigers-orange);
      color: var(--tigers-black);
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 600;
    }

    .coach-button:active {
      transform: scale(0.97);
    }

    .round-bar {
      margin: 16px 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .round-bar label {
      font-size: 14px;
      font-weight: 600;
    }

    .round-input {
      width: 70px;
      padding: 6px 8px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .round-button {
      background: var(--tigers-orange);
      color: var(--tigers-black);
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .round-title {
      margin: 8px 0 12px;
      font-size: 18px;
      font-weight: 700;
      color: var(--tigers-black);
    }

    .player-card {
      background: white;
      border-radius: 6px;
      padding: 10px 10px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }

    .player-name {
      font-size: 15px;
      font-weight: 500;
    }

    .vote-status {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 999px;
    }

    .voted {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .not-voted {
      background: #ffebee;
      color: #c62828;
    }

    .vote-button {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      font: inherit;
      color: inherit;
    }

    #voteOverlay, #coachOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      padding: 20px;
      z-index: 1000;
    }

    #voteBox, #coachBox {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }

    #voteBox h2, #coachBox h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .vote-option {
      width: 100%;
      margin: 4px 0;
      padding: 10px 14px;
      font-size: 15px;
      border-radius: 4px;
      border: 1px solid #ddd;
      background: #fafafa;
      text-align: left;
    }

    .vote-option:hover {
      background: #ffe0b2;
      border-color: var(--tigers-orange);
    }

    #closeOverlayBtn {
      margin-top: 8px;
      background: #ccc;
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 14px;
    }

    #coachResults {
      white-space: pre-wrap;
      font-size: 13px;
      max-height: 60vh;
      overflow-y: auto;
      border: 1px solid #eee;
      padding: 8px;
      border-radius: 4px;
      background: #fafafa;
    }

    .coach-actions {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .reset-button {
      background: #d32f2f;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 600;
    }

    .close-button {
      background: #9e9e9e;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="top-bar">
    <div class="club-info">
      <img src="WMJRLFC-logo.jpg" alt="WMJRLFC Logo" class="club-logo">
      <div class="titles">
        <div class="titles-main">WMJRLFC U11 Voting</div>
        <div class="titles-sub">Tigers Colours • Kids’ Player Votes</div>
      </div>
    </div>
    <button class="coach-button" onclick="openCoachPIN()">Coach</button>
  </div>

  <div class="app-container">
    <div class="round-bar">
      <label for="roundInput">Round</label>
      <input type="number" id="roundInput" class="round-input" value="1" min="1">
      <button class="round-button" onclick="changeRound()">Set</button>
    </div>

    <div id="roundTitle" class="round-title"></div>

    <div id="playerList"></div>
  </div>

  <div id="voteOverlay">
    <div id="voteBox">
      <h2 id="voteTitle"></h2>
      <p style="font-size:13px; margin-top:0; color:#555;">
        Kids: tap the player you want to give your vote to for this round.
      </p>
      <div id="voteOptions"></div>
      <button id="closeOverlayBtn" onclick="closeVoteOverlay()">Cancel</button>
    </div>
  </div>

  <div id="coachOverlay">
    <div id="coachBox">
      <h2>Coach Results</h2>
      <div id="coachResults"></div>

      <div class="coach-actions">
        <button class="reset-button" onclick="resetSeason()">Reset Season</button>
        <button class="close-button" onclick="closeCoachOverlay()">Close</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCooiQwStOGMygIS2nn8ZzvGUlZR15E0Z4",
      authDomain: "u11-voting.firebaseapp.com",
      projectId: "u11-voting",
      storageBucket: "u11-voting.firebasestorage.app",
      messagingSenderId: "512052329704",
      appId: "1:512052329704:web:123ae54d6c17fd7ed1dd5d",
      measurementId: "G-NDTRTVL9PN"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const PIN = "2287";

    const players = [
      { id: 1, name: 'Aaleyah Thoroughgood' },
      { id: 2, name: 'Archie Hickson' },
      { id: 3, name: 'Archie Nean' },
      { id: 4, name: 'Ari Finlay' },
      { id: 5, name: 'Axton Thomas' },
      { id: 6, name: 'Axel Velasquez Williamson' },
      { id: 7, name: 'Boaz Bowman' },
      { id: 8, name: 'Cash Walters' },
      { id: 9, name: 'Chayce Cumpson' },
      { id: 10, name: 'Don Moodie' },
      { id: 11, name: 'Ethan Sadowski' },
      { id: 12, name: 'Max Croak' },
      { id: 13, name: 'Taj Lennard' },
      { id: 14, name: 'Tanner Paton' },
      { id: 15, name: 'William Hand' },
      { id: 16, name: 'Zayden Clifford' }
    ];

    let currentRound = 1;
    let currentVoterId = null;
    let cachedVotes = [];

    async function init() {
      document.getElementById('roundInput').value = currentRound;
      await loadVotes();
      render();
    }

    async function loadVotes() {
      const snap = await db.collection('votes').get();
      cachedVotes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }

    function changeRound() {
      const val = parseInt(document.getElementById('roundInput').value, 10);
      if (val >= 1) {
        currentRound = val;
        render();
      }
    }

    function votesForRound(round) {
      return cachedVotes.filter(v => v.round === round);
    }

    function hasVoted(playerId) {
      return cachedVotes.some(v => v.round === currentRound && v.voterId === playerId);
    }

    async function recordVote(voterId, votedForId) {
      if (voterId === votedForId) {
        alert('You cannot vote for yourself.');
        return;
      }

      const existing = cachedVotes.find(v => v.round === currentRound && v.voterId === voterId);
      if (existing) {
        alert('This player has already voted this round.');
        return;
      }

      await db.collection('votes').add({
        round: currentRound,
        voterId,
        votedForId,
        timestamp: Date.now()
      });

      await loadVotes();
      closeVoteOverlay();
      render();
    }

    function openVoteOverlay(voterId) {
      if (hasVoted(voterId)) {
        alert('This player has already voted this round.');
        return;
      }
      currentVoterId = voterId;
      const voter = players.find(p => p.id === voterId);
      document.getElementById('voteTitle').textContent =
        `Who is ${voter.name} voting for this round?`;

      const optionsDiv = document.getElementById('voteOptions');
      optionsDiv.innerHTML = '';

      players
        .filter(p => p.id !== voterId)
        .forEach(p => {
          const btn = document.createElement('button');
          btn.className = 'vote-option';
          btn.textContent = p.name;
          btn.onclick = () => recordVote(voterId, p.id);
          optionsDiv.appendChild(btn);
        });

      document.getElementById('voteOverlay').style.display = 'flex';
    }

    function closeVoteOverlay() {
      document.getElementById('voteOverlay').style.display = 'none';
      currentVoterId = null;
    }

    function openCoachPIN() {
      const entered = prompt("Enter coach PIN:");
      if (entered === PIN) {
        openCoachOverlay();
      } else if (entered !== null) {
        alert("Incorrect PIN");
      }
    }

    async function openCoachOverlay() {
      await loadVotes();
      const resultsDiv = document.getElementById('coachResults');
      resultsDiv.textContent = generateCoachReport();
      document.getElementById('coachOverlay').style.display = 'flex';
    }

    function closeCoachOverlay() {
      document.getElementById('coachOverlay').style.display = 'none';
    }

    async function resetSeason() {
      if (!confirm("Are you sure you want to reset ALL rounds and votes for the season?")) return;

      const snap = await db.collection('votes').get();
      const batch = db.batch();
      snap.forEach(doc => batch.delete(doc.ref));
      await batch.commit();

      cachedVotes = [];
      currentRound = 1;
      document.getElementById('roundInput').value = 1;
      render();
      closeCoachOverlay();
      alert("Season has been reset.");
    }

    function generateCoachReport() {
      let text = "";

      text += `=== CURRENT ROUND (${currentRound}) TALLY ===\n`;
      const roundVotes = votesForRound(currentRound);
      const roundCounts = {};
      roundVotes.forEach(v => {
        roundCounts[v.votedForId] = (roundCounts[v.votedForId] || 0) + 1;
      });
      players.forEach(p => {
        text += `${p.name}: ${roundCounts[p.id] || 0}\n`;
      });

      text += `\n=== FULL VOTE LIST (ROUND ${currentRound}) ===\n`;
      roundVotes.forEach(v => {
        const voter = players.find(p => p.id === v.voterId)?.name || 'Unknown';
        const votedFor = players.find(p => p.id === v.votedForId)?.name || 'Unknown';
        text += `${voter} → ${votedFor}\n`;
      });

      text += `\n=== SEASON TOTALS ===\n`;
      const seasonCounts = {};
      cachedVotes.forEach(v => {
        seasonCounts[v.votedForId] = (seasonCounts[v.votedForId] || 0) + 1;
      });
      players.forEach(p => {
        text += `${p.name}: ${seasonCounts[p.id] || 0}\n`;
      });

      text += `\n=== ROUND HISTORY ===\n`;
      const rounds = [...new Set(cachedVotes.map(v => v.round))].sort((a,b)=>a-b);
      rounds.forEach(r => {
        text += `\nRound ${r}:\n`;
        const rv = votesForRound(r);
        const c = {};
        rv.forEach(v => c[v.votedForId] = (c[v.votedForId] || 0) + 1);
        players.forEach(p => {
          text += `  ${p.name}: ${c[p.id] || 0}\n`;
        });
      });

      return text;
    }

    function render() {
      document.getElementById('roundTitle').textContent = `Round ${currentRound}`;

      const listDiv = document.getElementById('playerList');
      listDiv.innerHTML = '';
      players.forEach(p => {
        const card = document.createElement('div');
        card.className = 'player-card';

        const btn = document.createElement('button');
        btn.className = 'vote-button';
        btn.textContent = p.name;
        btn.onclick = () => openVoteOverlay(p.id);

        const nameSpan = document.createElement('span');
        nameSpan.className = 'player-name';
        nameSpan.appendChild(btn);

        const tag = document.createElement('span');
        tag.className = 'vote-status ' + (hasVoted(p.id) ? 'voted' : 'not-voted');
        tag.textContent = hasVoted(p.id) ? 'Voted' : 'Not voted';

        card.appendChild(nameSpan);
        card.appendChild(tag);
        listDiv.appendChild(card);
      });
    }

    init();
  </script>
</body>
</html>
