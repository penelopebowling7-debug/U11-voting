<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMJRLFC U11 Voting</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #FF8C00;
            color: white;
            padding: 20px;
        }

        header img {
            height: 80px;
        }

        h1 {
            margin: 10px 0 0 0;
        }

        h2 {
            margin: 5px 0 0 0;
            font-weight: normal;
            font-size: 18px;
        }

        .container {
            padding: 20px;
        }

        .player-btn {
            display: block;
            width: 90%;
            margin: 10px auto;
            padding: 15px;
            background-color: #FFA500;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .player-btn:hover {
            background-color: #FF7A00;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
        }

        .modal-content {
            background: white;
            margin: 20% auto;
            padding: 20px;
            width: 80%;
            max-width: 350px;
            border-radius: 10px;
        }

        .modal button {
            width: 45%;
            padding: 12px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .confirm-btn {
            background-color: #28a745;
            color: white;
        }

        .cancel-btn {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <img src="WMJRLFC-logo.jpg" alt="Club Logo">
    <h1>WMJRLFC U11 Voting</h1>
    <h2>U11's Players' Player Voting</h2>
</header>

<div class="container">
    <h3>Select Your Name</h3>
    <div id="voterList"></div>
</div>

<!-- Voting Screen -->
<div class="container" id="voteScreen" style="display:none;">
    <h3 id="voterTitle"></h3>
    <p>Select the player you want to vote for:</p>
    <div id="playerList"></div>
</div>

<!-- Confirmation Modal -->
<div id="confirmModal" class="modal">
    <div class="modal-content">
        <h3>Confirm Vote</h3>
        <p id="confirmText"></p>
        <button class="confirm-btn" id="confirmVoteBtn">Confirm</button>
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script type="module">
    // Firebase imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Firebase config
    const firebaseConfig = {
        apiKey: "AIzaSyDq-EXAMPLE",
        authDomain: "wmjrlfc-voting.firebaseapp.com",
        projectId: "wmjrlfc-voting",
        storageBucket: "wmjrlfc-voting.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abc123"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Players
    const players = [
        "Ax", "Player 2", "Player 3", "Player 4",
        "Player 5", "Player 6", "Player 7", "Player 8",
        "Player 9", "Player 10", "Player 11", "Player 12"
    ];

    let selectedVoter = "";
    let selectedVote = "";

    // Load voter list
    const voterListDiv = document.getElementById("voterList");
    players.forEach(name => {
        const btn = document.createElement("button");
        btn.className = "player-btn";
        btn.textContent = name;
        btn.onclick = () => openVoting(name);
        voterListDiv.appendChild(btn);
    });

    // Open voting screen
    function openVoting(voter) {
        selectedVoter = voter;
        document.getElementById("voterTitle").textContent = `Voting as: ${voter}`;
        document.getElementById("voteScreen").style.display = "block";

        const playerListDiv = document.getElementById("playerList");
        playerListDiv.innerHTML = "";

        players.forEach(player => {
            if (player !== voter) {
                const btn = document.createElement("button");
                btn.className = "player-btn";
                btn.textContent = player;
                btn.onclick = () => openConfirm(player);
                playerListDiv.appendChild(btn);
            }
        });
    }

    // Open confirmation modal
    function openConfirm(player) {
        selectedVote = player;
        document.getElementById("confirmText").textContent =
            `Are you sure you want to vote for ${player}?`;
        document.getElementById("confirmModal").style.display = "block";
    }

    // Close modal
    function closeModal() {
        document.getElementById("confirmModal").style.display = "none";
    }

    // Confirm vote
    document.getElementById("confirmVoteBtn").onclick = async () => {
        const playerRef = doc(db, "votes", selectedVote);

        await updateDoc(playerRef, {
            count: increment(1)
        });

        closeModal();
        alert("Vote submitted successfully!");

        // Reset UI
        document.getElementById("voteScreen").style.display = "none";
        selectedVoter = "";
        selectedVote = "";
    };
</script>

</body>
</html>
